[package]
name = "fingerprint-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A measured, best-effort HTTPS domain bridge with TLS and HTTP fingerprint comparison"
license = "MIT"

[dependencies]
anyhow = "1"
btls = "=0.5.6"
tokio-btls = "=0.5.6"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
sha2 = "0.10"
hex = "0.4"
hpack = "0.3"
url = "2"
socket2 = { version = "0.6", features = ["all"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
brotli = "8"
flate2 = "1"

[dev-dependencies]
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2"] }

[profile.release]
lto = "thin"
